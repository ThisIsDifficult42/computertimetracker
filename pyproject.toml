[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computertimenotifier"
version = "0.1.0"
description = "Windows notifications for remaining Microsoft Family Safety computer time."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "keyring>=25.7",
    # Fork of pantherale0/pyfamilysafety that can read device limit schedules.
    "pyfamilysafety @ https://github.com/ThisIsDifficult42/pyfamilysafety/archive/eeba411c18b397986516e0d39ad48437e16e6654.zip",
    "windows-toasts>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
